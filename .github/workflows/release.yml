name: Release Multi-Platform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v0.2.0)'
        required: false
        default: 'v0.2.0'
      draft:
        description: 'Publish as Draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Publish as Pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            artifact-pattern: |
              software/desktop-app/src-tauri/target/release/bundle/nsis/*.exe
              software/desktop-app/src-tauri/target/release/bundle/msi/*.msi
              software/desktop-app/src-tauri/target/release/touchpass-desktop.exe
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x64
            os: macos-13
            artifact-pattern: |
              software/desktop-app/src-tauri/target/release/bundle/dmg/*.dmg
              software/desktop-app/src-tauri/target/release/bundle/macos/*.app
          - platform: linux-x64
            os: ubuntu-24.04
            artifact-pattern: |
              software/desktop-app/src-tauri/target/release/bundle/deb/*.deb
              software/desktop-app/src-tauri/target/release/bundle/appimage/*.AppImage
              software/desktop-app/src-tauri/target/release/touchpass-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libudev-dev \
            build-essential

      - name: Install frontend dependencies
        working-directory: software/desktop-app
        run: npm install

      - name: Typecheck frontend
        working-directory: software/desktop-app
        run: npm run check

      - name: Run frontend unit tests
        working-directory: software/desktop-app
        run: npm test

      - name: Run Rust backend tests
        working-directory: software/desktop-app/src-tauri
        run: cargo test

      - name: Build Tauri release bundles
        working-directory: software/desktop-app
        run: npm run tauri:build

      - name: Stage release assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-stage | Out-Null
          Get-ChildItem -Path software/desktop-app/src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Copy-Item -Destination release-stage/
          Get-ChildItem -Path software/desktop-app/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Copy-Item -Destination release-stage/
          
          # Create portable zip
          $portableDir = "release-stage/touchpass-windows-x64-portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item software/desktop-app/src-tauri/target/release/touchpass-desktop.exe "$portableDir/TouchPass.exe"
          Copy-Item start_touchpass.bat "$portableDir/"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-stage/TouchPass_windows_x64_portable.zip"
          Remove-Item -Recurse -Force $portableDir

      - name: Stage release assets (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-stage
          cp software/desktop-app/src-tauri/target/release/bundle/dmg/*.dmg release-stage/ 2>/dev/null || true
          if [ -d "software/desktop-app/src-tauri/target/release/bundle/macos/TouchPass.app" ]; then
            tar -czf "release-stage/TouchPass_${{ matrix.platform }}.app.tar.gz" -C software/desktop-app/src-tauri/target/release/bundle/macos TouchPass.app
          fi

      - name: Stage release assets (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-stage
          cp software/desktop-app/src-tauri/target/release/bundle/deb/*.deb release-stage/ 2>/dev/null || true
          cp software/desktop-app/src-tauri/target/release/bundle/appimage/*.AppImage release-stage/ 2>/dev/null || true
          if [ -f "software/desktop-app/src-tauri/target/release/touchpass-desktop" ]; then
            tar -czf release-stage/TouchPass_linux_x64_standalone.tar.gz -C software/desktop-app/src-tauri/target/release touchpass-desktop
          fi

      - name: Upload platform build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-stage/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: release-assets-*
          merge-multiple: true

      - name: Generate Checksums & Organize Files
        run: |
          mkdir -p release-final
          cp all-artifacts/* release-final/ 2>/dev/null || true
          cd release-final
          sha256sum * > checksums.txt || true
          cat checksums.txt

      - name: Compute Tag Name
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.2.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: TouchPass Desktop ${{ steps.tag_info.outputs.tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: release-final/*
          generate_release_notes: true
          body: |
            ## TouchPass Desktop App Release (${{ steps.tag_info.outputs.tag }})
            
            Bản phát hành chính thức cho ứng dụng **TouchPass Desktop App** viết bằng **Rust + Tauri v2 + Svelte 5**.
            
            ### Các gói cài đặt & File thực thi:
            - **Windows (x64)**:
              - `.exe` (NSIS Installer): Cài đặt chuẩn có shortcut và quản lý gỡ cài đặt.
              - `.msi`: Gói Windows Installer cho doanh nghiệp/hệ thống.
              - `.zip` (Portable): Giải nén và chạy ngay `TouchPass.exe` không cần cài đặt.
            - **macOS (Apple Silicon và Intel)**:
              - `.dmg`: Chọn file `aarch64` cho Apple Silicon hoặc `x64` cho Intel, sau đó kéo vào `Applications`.
              - `.app.tar.gz`: Gói nén trực tiếp của `TouchPass.app` theo từng kiến trúc.
            - **Ubuntu / Linux (x64)**:
              - `.deb`: Cài đặt qua `sudo dpkg -i touchpass_*.deb`.
              - `.AppImage`: Cấp quyền thực thi (`chmod +x`) và chạy trực tiếp.
              - `.tar.gz`: Binary thực thi standalone.
            
            ### Toàn vẹn dữ liệu:
            Xem chi tiết mã băm SHA256 tại file `checksums.txt` đính kèm.

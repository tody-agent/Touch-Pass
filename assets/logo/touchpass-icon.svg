<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="40%" stop-color="#101317" />
      <stop offset="100%" stop-color="#07080A" />
    </linearGradient>

    <!-- Top Rim Specular Gradient -->
    <linearGradient id="rim-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#94A3B8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.02" />
    </linearGradient>

    <!-- Inner Plate Bevel Gradient -->
    <linearGradient id="inner-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1A202C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Titanium Brushed Metallic Gradient for Key Body -->
    <linearGradient id="titanium-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="15%" stop-color="#E2E8F0" />
      <stop offset="35%" stop-color="#94A3B8" />
      <stop offset="55%" stop-color="#475569" />
      <stop offset="75%" stop-color="#64748B" />
      <stop offset="90%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Chamfer / Highlight Gradient -->
    <linearGradient id="titanium-edge" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.1" />
    </linearGradient>

    <!-- Key Core Gold Ring Gradient -->
    <linearGradient id="gold-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Cyber Cyan Radial Glow -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="25%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0077B6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#001845" stop-opacity="0" />
    </radialGradient>

    <!-- Center Sensor Iris Glow -->
    <radialGradient id="iris-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0FFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#0077B6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0A0E17" stop-opacity="0.9" />
    </radialGradient>

    <!-- Drop Shadow Filter for Key -->
    <filter id="key-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F0FF" flood-opacity="0.15" />
    </filter>

    <!-- Cyan Bloom Glow Filter -->
    <filter id="cyan-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Squircle Clip Path -->
    <clipPath id="squircle-shape">
      <path d="M 256,16 C 390,16 430,16 468,54 C 506,92 506,132 506,266 C 506,400 506,440 468,478 C 430,516 390,516 256,516 C 122,516 82,516 44,478 C 6,440 6,400 6,266 C 6,132 6,92 44,54 C 82,16 122,16 256,16 Z" />
    </clipPath>
  </defs>

  <!-- Base Plate (Squircle with Obsidian Gradient) -->
  <path d="M 256,16 C 390,16 430,16 468,54 C 506,92 506,132 506,266 C 506,400 506,440 468,478 C 430,516 390,516 256,516 C 122,516 82,516 44,478 C 6,440 6,400 6,266 C 6,132 6,92 44,54 C 82,16 122,16 256,16 Z" fill="url(#bg-grad)" />

  <!-- Ambient Top Horizon Glow -->
  <ellipse cx="256" cy="40" rx="180" ry="60" fill="#00D2FF" opacity="0.06" filter="url(#cyan-bloom)" />

  <!-- Subtle Radial Dark Vignette / Inner Bevel -->
  <path d="M 256,16 C 390,16 430,16 468,54 C 506,92 506,132 506,266 C 506,400 506,440 468,478 C 430,516 390,516 256,516 C 122,516 82,516 44,478 C 6,440 6,400 6,266 C 6,132 6,92 44,54 C 82,16 122,16 256,16 Z" fill="none" stroke="url(#rim-stroke)" stroke-width="2" />

  <!-- 45-Degree Titan Key Group (Rotated 45 degrees, centered at 256, 256) -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#key-shadow)">

    <!-- Cyan Backlight Aura behind Key Head -->
    <circle cx="160" cy="256" r="75" fill="url(#cyan-glow)" opacity="0.45" />

    <!-- Ambient Shadow Under Key -->
    <path d="M 160,186 C 121,186 90,217 90,256 C 90,295 121,326 160,326 C 188,326 212,310 223,286 L 360,286 L 360,332 L 396,332 L 396,286 L 416,286 L 416,322 L 444,322 L 444,256 L 444,226 L 223,226 C 212,202 188,186 160,186 Z" fill="#000000" opacity="0.35" transform="translate(6, 12)" />

    <!-- Solid Titanium Key Body -->
    <path d="M 160,186 C 121,186 90,217 90,256 C 90,295 121,326 160,326 C 188,326 212,310 223,286 L 360,286 L 360,332 L 396,332 L 396,286 L 416,286 L 416,322 L 444,322 L 444,256 L 444,226 L 223,226 C 212,202 188,186 160,186 Z" fill="url(#titanium-main)" stroke="url(#titanium-edge)" stroke-width="3" stroke-linejoin="round" />

    <!-- Key Shaft Spine Highlight -->
    <line x1="225" y1="256" x2="440" y2="256" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" />
    <line x1="225" y1="258" x2="440" y2="258" stroke="#1E293B" stroke-opacity="0.4" stroke-width="1.5" />

    <!-- Gold Touch Notch Accent on Key Bit -->
    <rect x="362" y="324" width="32" height="6" rx="2" fill="url(#gold-core)" />
    <rect x="418" y="314" width="24" height="6" rx="2" fill="url(#gold-core)" />

    <!-- Key Head Outer Chamfer Ring -->
    <circle cx="160" cy="256" r="54" fill="none" stroke="url(#titanium-edge)" stroke-width="4" />

    <!-- Gold Security Accent Ring -->
    <circle cx="160" cy="256" r="44" fill="#0E131B" stroke="url(#gold-core)" stroke-width="3.5" />

    <!-- Biometric Cyan Glowing Core / Iris -->
    <circle cx="160" cy="256" r="34" fill="url(#iris-glow)" filter="url(#cyan-bloom)" />

    <!-- High-tech Concentric Sensor Ring & Pulse Node -->
    <circle cx="160" cy="256" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="8 4" />
    <circle cx="160" cy="256" r="8" fill="#FFFFFF" opacity="0.95" />
    <circle cx="160" cy="256" r="4" fill="#00F0FF" />

    <!-- Micro Tech Notch Marks on Ring -->
    <line x1="160" y1="214" x2="160" y2="220" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" />
    <line x1="160" y1="292" x2="160" y2="298" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" />
    <line x1="118" y1="256" x2="124" y2="256" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" />
    <line x1="196" y1="256" x2="202" y2="256" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" />

  </g>

  <!-- Specular Top Rim Arc Light -->
  <path d="M 70,62 C 120,28 180,20 256,20 C 332,20 392,28 442,62" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round" />
</svg>